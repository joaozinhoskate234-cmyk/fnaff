name: Compilar MLGBot

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Instalar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Guardar o Spigot em cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/bt/spigot-1.8.8.jar
          key: spigot-jar-1.8.8

      - name: Gerar o Spigot 1.8.8 (demora alguns minutos)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/bt && cd ~/bt
          curl -L -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          java -jar BuildTools.jar --rev 1.8.8

      - name: Compilar o plugin
        run: |
          if [ ! -f Settings.java ]; then mv Configura*.java Settings.java; fi
          mkdir -p out
          javac -encoding UTF-8 -cp ~/bt/spigot-1.8.8.jar -d out *.java
          cp plugin.yml config.yml out/
          jar cf MLGBot.jar -C out .

      - name: Guardar o MLGBot.jar
        uses: actions/upload-artifact@v4
        with:
          name: MLGBot
          path: MLGBot.jar
